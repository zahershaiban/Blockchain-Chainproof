services:
  chainproof:
    build: .
    container_name: chainproof-demo
    ports:
      - "8501:8501"
      - "8545:8545"
    environment:
      RPC_URL: http://127.0.0.1:8545
      PRIVATE_KEY: 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
    volumes:
      - chainproof-artifacts:/app/artifacts

volumes:
  chainproof-artifacts:
